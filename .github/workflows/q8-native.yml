on:
  push:
    branches:
    - multiply-gamma
    - fix-multiply-gamma
  workflow_dispatch:

permissions:
  contents: read

name: Q8 native
jobs:
  macos:
    name: macOS Q8 (arm64)
    runs-on: macos-14

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      - name: Clone ImageMagick libraries
        run: ./checkout.sh --no-configure --dependencies-artifact macos-arm64-static.zip
        working-directory: src/ImageMagick

      - name: Install build tools
        run: ./install.build-tools.sh
        working-directory: build/macos-arm64

      - name: Build ImageMagick
        run: ../../../build/shared/build.imagemagick.sh macos arm64 Q8
        working-directory: src/ImageMagick/ImageMagick

      - name: Build Native
        run: ../../build/shared/build.native.sh macos arm64 Q8
        working-directory: src/Magick.Native

      - name: Copy Native
        run: ../../build/shared/copy.native.sh ../../artifacts macos arm64 Q8
        working-directory: src/Magick.Native

      - name: Upload library
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: macos-Q8-arm64
          path: artifacts

      - name: Check out the regression test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          repository: schnoberts1/Magick.Native.RegressionTest
          path: regression-test
          persist-credentials: false

      - name: Install .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 #v6.0.0
        with:
          dotnet-version: 9.0.x

      # Magick.NET 14.17.1 uses this repo's tag 2026.904.721.
      - name: Run the regression test on the built library
        run: |
          dotnet build -p:MagickNetVersion=14.17.1 -o build
          cp ../artifacts/Magick.Native-Q8-arm64.dll.dylib build/runtimes/osx-arm64/native/
          dotnet build/Magick.Native.RegressionTest.dll out
        working-directory: regression-test

  linux:
    name: linux Q8 (x64)
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:20.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      - name: Install build tools
        run: ./install.build-tools.sh
        working-directory: build/linux-x64

      - name: Clone ImageMagick libraries
        run: ./checkout.sh --no-configure --dependencies-artifact linux-x64-static.zip
        working-directory: src/ImageMagick

      - name: Build ImageMagick
        run: ../../../build/shared/build.imagemagick.sh linux x64 Q8 noOpenMP
        working-directory: src/ImageMagick/ImageMagick

      - name: Build Native
        run: ../../build/shared/build.native.sh linux x64 Q8 noOpenMP
        working-directory: src/Magick.Native

      - name: Copy Native
        run: ../../build/shared/copy.native.sh ../../artifacts linux x64 Q8 noOpenMP
        working-directory: src/Magick.Native

      - name: Upload library
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: linux-Q8-x64
          path: artifacts

  linux-test:
    name: Regression test (linux x64)
    runs-on: ubuntu-24.04
    needs: linux

    steps:
      - name: Check out the regression test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          repository: schnoberts1/Magick.Native.RegressionTest
          path: regression-test
          persist-credentials: false

      - name: Download the built library
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: linux-Q8-x64
          path: artifacts

      - name: Install .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 #v6.0.0
        with:
          dotnet-version: 9.0.x

      # The reference image was made on macOS arm64. This step fails if it does not hold on linux x64.
      - name: Check the reference on the stock 14.10.3 package
        run: dotnet run -p:MagickNetPackage=Magick.NET-Q8-x64 -p:MagickNetVersion=14.10.3 -- out/stock
        working-directory: regression-test

      - name: Run the regression test on the built library
        run: |
          dotnet build -p:MagickNetPackage=Magick.NET-Q8-x64 -p:MagickNetVersion=14.17.1 -o build
          cp ../artifacts/Magick.Native-Q8-x64.dll.so build/runtimes/linux-x64/native/
          dotnet build/Magick.Native.RegressionTest.dll out
        working-directory: regression-test
